<article
  dir="rtl"
  class="group relative overflow-hidden rounded-2xl border border-amber-200/80 bg-gradient-to-br from-white via-amber-50 to-yellow-100 p-5 shadow-md transition-all duration-300 hover:-translate-y-1 hover:shadow-xl"
>
  <!-- لمسة ذهبية أعلى البطاقة -->
  <div
    class="absolute right-0 top-0 h-1.5 w-full bg-gradient-to-l from-amber-600 via-yellow-400 to-amber-200"
  ></div>

  <!-- رأس البطاقة -->
  <div class="flex items-center justify-between gap-3">
    <div
      class="flex h-12 w-12 items-center justify-center rounded-xl bg-amber-100 text-2xl text-amber-700 ring-1 ring-amber-200"
    >
      ✦
    </div>

    <span
      class="rounded-full border border-amber-300 bg-white/80 px-4 py-1.5 text-sm font-bold text-amber-800"
    >
      عيار {{ karat }}
    </span>
  </div>

  <!-- وصف السعر -->
  <p class="mb-2 mt-6 text-sm font-medium text-gray-500">
    سعر الغرام الواحد
  </p>

  <!-- السعر -->
  <div class="flex flex-wrap items-baseline gap-2">
    <span
      class="text-3xl font-extrabold tracking-tight text-gray-900 sm:text-4xl"
    >
      {{ price | number:'1.3-3' }}
    </span>

    <span class="text-sm font-bold text-amber-800">
      ر.ع
    </span>
  </div>

  <!-- التغير في السعر -->
  <div
    class="mt-5 flex flex-wrap items-center gap-2 rounded-xl border border-gray-100 bg-white/80 px-3 py-3 text-sm"
    [class.!border-green-200]="isUp"
    [class.!border-red-200]="isDown"
  >
    <span
      class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-100 font-bold text-gray-500"
      [class.!bg-green-100]="isUp"
      [class.!text-green-700]="isUp"
      [class.!bg-red-100]="isDown"
      [class.!text-red-700]="isDown"
    >
    @if (isUp) {▲} @else if (isDown) {▼} @else {↔}
    </span>
    <div class="flex min-w-0 flex-1 flex-wrap items-center gap-1.5">
      <span
        class="font-bold text-gray-600"
        [class.!text-green-700]="isUp"
        [class.!text-red-700]="isDown"
      >
        {{ change > 0 ? '+' : '' }}{{ change | number:'1.3-3' }}
        ر.ع
      </span>

      <span
        class="text-xs text-gray-500"
        [class.!text-green-700]="isUp"
        [class.!text-red-700]="isDown"
      >
        ({{ changePercent | percent:'1.2-2' }})
      </span>
    </div>
  </div>

  <!-- أسفل البطاقة -->
  <div
    class="mt-4 border-t border-amber-200/80 pt-3 text-xs text-gray-500"
  >
    <span class="ml-1 text-amber-600">✦</span>
    مقارنةً بسعر اليوم السابق
  </div>
</article>
